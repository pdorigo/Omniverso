.distant-stars {

.distant-star {
  position: absolute;
  display: block;
  border-radius: 999px;
  background: #efeaff;
  box-shadow: 0 0 2px rgba(239, 234, 255, 0.28);
  opacity: var(--twinkle-min, 0.2);
  animation:
    distant-star-drift var(--drift-duration, 12s) ease-in-out infinite alternate,
    distant-star-twinkle var(--twinkle-duration, 4s) ease-in-out infinite alternate;
  animation-delay: var(--drift-delay, 0s), var(--twinkle-delay, 0s);
  will-change: transform, opacity, box-shadow;
}

@keyframes distant-star-drift {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(var(--drift-x, 10px), var(--drift-y, -18px), 0);
  }
}

@keyframes distant-star-twinkle {
  from {
    opacity: var(--twinkle-min, 0.12);
    box-shadow: 0 0 1px rgba(239, 234, 255, 0.12);
  }

  to {
    opacity: var(--twinkle-max, 0.9);
    box-shadow: 0 0 var(--star-glow, 5px) rgba(255, 255, 255, 0.65), 0 0 calc(var(--star-glow, 5px) * 1.6) rgba(185, 168, 255, 0.35);
  }
}

.accordion-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transition: grid-template-rows 0.38s ease, opacity 0.3s ease;
}

.accordion-panel.is-open {
  grid-template-rows: 1fr;
  opacity: 1;
}

.accordion-inner {
  min-height: 0;
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce) {
  .accordion-panel {
    transition: none;
  }
}

.clean-button {
  background: #663BE6;
  border: 0;
  border-radius: 999px;
  box-shadow: 0 10px 28px rgba(102, 59, 230, 0.30), 0 3px 10px rgba(0, 0, 0, 0.22);
  text-shadow: none;
  transition: background 0.45s ease, transform 0.45s ease, box-shadow 0.45s ease;
}

.clean-button:hover,
.clean-button:focus-visible {
  background: #7a52ef;
  transform: translateY(-1px);
  box-shadow: 0 14px 32px rgba(102, 59, 230, 0.36), 0 4px 12px rgba(0, 0, 0, 0.22);
}

.clean-button:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.85);
  outline-offset: 3px;
}

.clean-button:active {
  background: #5a31d1;
  transform: translateY(0);
}

/* ——— Centro vazio: os 4 botões orbitam um espaço limpo, sem planeta ——— */

.planet-stage {
  position: relative;
  width: min(100%, 580px);
  height: 322px;
  margin: 28px auto 0;
  isolation: isolate;
}

.orbit-button {
  position: absolute;
  z-index: 2;
  min-height: 46px;
  width: -moz-max-content;
  width: max-content;
  max-width: 192px;
  padding: 12px 16px;
  border: 1px solid rgba(185, 168, 255, 0.68);
  border-radius: 999px;
  background: #2A1A5E;
  color: #F2EDFF;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
}

.orbit-button--top {
  left: 50%;
  top: 0;
  translate: -50% 0;
  animation: float-top 5.2s ease-in-out infinite alternate;
}

.orbit-button--bottom {
  left: 50%;
  bottom: 0;
  translate: -50% 0;
  animation: float-bottom 5.8s ease-in-out infinite alternate;
}

.orbit-button--left {
  left: 0;
  top: 50%;
  max-width: 124px;
  translate: 0 -50%;
  animation: float-side 5.5s ease-in-out infinite alternate;
}

.orbit-button--right {
  right: 0;
  top: 50%;
  max-width: 124px;
  translate: 0 -50%;
  animation: float-side 6.2s ease-in-out infinite alternate;
  animation-delay: -2.4s;
}

@keyframes float-top {
  from {
    translate: -50% 0;
  }

  to {
    translate: -50% -4px;
  }
}

@keyframes float-bottom {
  from {
    translate: -50% 0;
  }

  to {
    translate: -50% 4px;
  }
}

@keyframes float-side {
  from {
    translate: 0 calc(-50% - 3px);
  }

  to {
    translate: 0 calc(-50% + 3px);
  }
}

.orbit-button:hover {
  background: #3b257f;
}

.orbit-button:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.85);
  outline-offset: 3px;
}

.orbit-button.is-active {
  background: #663be6;
  border-color: #b9a8ff;
}

.floating-cta {
  animation: gentle-float 7s ease-in-out infinite alternate;
  will-change: transform;
}

@keyframes gentle-float {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-3px);
  }
}

/* ——— Modal central de leitura ——— */

.reading-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  padding-top: max(14px, var(--safe-area-inset-top));
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  background: rgba(5, 2, 18, 0.72);
  backdrop-filter: blur(4px);
}

.reading-modal {
  display: flex;
  flex-direction: column;
  width: min(100%, 680px);
  max-height: min(92vh, 860px);
  min-height: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 28px;
  background: #1E1E24;
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5), 0 8px 22px rgba(0, 0, 0, 0.3);
  animation: planet-card-in 0.28s ease both;
}

.reading-modal__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 24px 12px;
  flex: none;
}

.reading-modal__close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  flex: none;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  color: #F2EDFF;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.reading-modal__close:hover {
  background: rgba(255, 255, 255, 0.14);
}

.reading-modal__close:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.85);
  outline-offset: 3px;
}

.reading-modal__close:active {
  transform: scale(0.96);
}

.reading-modal__scroll {
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 4px 24px 28px;
  scrollbar-color: rgba(185, 168, 255, 0.55) transparent;
}

.reading-modal__content {
  padding-bottom: 4px;
}

/* ——— Tópicos dos modais: uma única lista, mesma bolinha roxa em todos ——— */

.modal-topics {
  list-style: none;
  margin: 20px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.modal-topic {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 0;
  padding: 0;
}

.modal-topic__bullet {
  flex: 0 0 auto;
  width: 12px;
  color: #663BE6;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.7;
  text-align: left;
}

.modal-topic__content {
  min-width: 0;
  flex: 1;
}

.modal-topic__title {
  margin: 0;
  color: var(--text);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.9;
}

.modal-topic__text {
  margin: 0;
  color: var(--text);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.9;
}

.modal-topic__title + .modal-topic__text {
  margin-top: 2px;
}

.modal-topic__text--strong {
  font-weight: 700;
}

@media (min-width: 640px) {
  .modal-topic__bullet {
    line-height: 1.8;
  }

  .modal-topic__title,
  .modal-topic__text {
    font-size: 17px;
  }
}

@media (max-width: 639px) {
  .reading-modal-overlay {
    padding: 10px;
  }

  .reading-modal {
    width: 100%;
    max-height: 94dvh;
    border-radius: 26px;
  }

  .reading-modal__header {
    padding: 20px 20px 10px;
  }

  .reading-modal__scroll {
    padding: 2px 20px 24px;
  }

  .reading-modal__content .grid {
    grid-template-columns: 1fr !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .reading-modal {
    animation: none;
  }
}

@keyframes planet-card-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (min-width: 640px) {
  .planet-stage {
    height: 360px;
  }

  .orbit-button {
    font-size: 14px;
    padding: 13px 18px;
  }

  .orbit-button--left, .orbit-button--right {
    max-width: 172px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .orbit-button, .floating-cta {
    animation: none;
  }
}
